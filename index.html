<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Guestbook</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  input, textarea, select { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
  button { padding: 10px 16px; cursor: pointer; }
  .entry { border-bottom: 1px solid #ddd; padding: 12px 0; }
  .entry .name { font-weight: bold; }
  .entry .date { color: #888; font-size: 0.85em; }
</style>
</head>
<body>
  <h1>Sign my guestbook</h1>
  <form id="guestbook-form">
    <label>Name</label>
    <input type="text" id="name" required />

    <label>Message</label>
    <textarea id="message" rows="3" required></textarea>

    <label>Mood (optional)</label>
    <select id="mood">
      <option value="">--</option>
      <option value="impressed">Impressed</option>
      <option value="curious">Curious</option>
      <option value="just saying hi">Just saying hi</option>
    </select>

    <button type="submit">Sign</button>
  </form>

  <h2>Entries</h2>
  <div id="entries">Loading...</div>

  <script>
    const form = document.getElementById('guestbook-form');
    const entriesDiv = document.getElementById('entries');

    async function loadEntries() {
      const res = await fetch('/api/entries');
      const entries = await res.json();
      entriesDiv.innerHTML = entries.map(e => `
        <div class="entry">
          <div class="name">${e.name}${e.mood ? ' — ' + e.mood : ''}</div>
          <div class="date">${new Date(e.created_at).toLocaleString()}</div>
          <div>${e.message}</div>
        </div>
      `).join('') || '<p>No entries yet. Be the first!</p>';
    }

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const name = document.getElementById('name').value;
      const message = document.getElementById('message').value;
      const mood = document.getElementById('mood').value;

      await fetch('/api/sign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, message, mood }),
      });

      form.reset();
      loadEntries();
    });

    loadEntries();
  </script>
</body>
</html>
